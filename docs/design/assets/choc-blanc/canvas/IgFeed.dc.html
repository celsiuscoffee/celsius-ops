<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @font-face { font-family: "Peachi"; font-weight: 700; font-style: normal; src: url(data:font/otf;base64,__PEACHI_BOLD__) format("opentype"); }
    @font-face { font-family: "Peachi"; font-weight: 500; font-style: normal; src: url(data:font/otf;base64,__PEACHI_MED__) format("opentype"); }
    body { margin: 0; background: #0F0500; font-family: "Peachi", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    a { color: #FBBF24; } a:hover { color: #C97A4E; }
  </style>
</helmet>

<!-- Instagram / Facebook feed, 1080x1350 (4:5) - the tallest the feed allows,
     so it takes the most screen. Full-bleed photograph, no price: social is
     for desire and reach, and a price in the image dates the post and invites
     comparison in the comments. The price lives in the caption instead, where
     it can be edited without re-exporting. Glass sits at y 200..908. -->
<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #160800;">
  <img src="hero-ig-feed.jpg" alt="Choc Blanc iced espresso with whipped dark chocolate cream" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;">
  <div style="position: absolute; inset: 0 0 auto 0; height: 220px; background: linear-gradient(180deg, rgba(22,8,0,0.74) 0%, rgba(22,8,0,0.22) 60%, rgba(22,8,0,0) 100%);"></div>
  <div style="position: absolute; inset: auto 0 0 0; height: 680px; background: linear-gradient(180deg, rgba(22,8,0,0) 0%, rgba(22,8,0,0.40) 30%, rgba(22,8,0,0.82) 66%, rgba(22,8,0,0.94) 100%);"></div>

  <div style="position: absolute; inset: 0; padding: 54px 64px 58px 64px; display: flex; flex-direction: column; justify-content: space-between;">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 24px;">
      <div style="font-weight: 700; font-size: 46px; line-height: 1; color: #F5F3F0; letter-spacing: -0.01em;">&deg;C</div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
        <div style="font-weight: 700; font-size: 16px; letter-spacing: 0.30em; color: #FBBF24; text-transform: uppercase;">Merdeka Menu</div>
        <div style="font-weight: 500; font-size: 14px; letter-spacing: 0.16em; color: rgba(245,243,240,0.72); text-transform: uppercase;">31 Ogos &ndash; 30 Sept 2026</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 20px;">
      <div>
        <span style="display: inline-block; background: #A64B2C; color: #F5F3F0; font-weight: 700; font-size: 16px; letter-spacing: 0.24em; text-transform: uppercase; padding: 12px 22px; border-radius: 4px;">New on the menu</span>
      </div>
      <h1 style="margin: 0; font-weight: 700; font-size: 132px; line-height: 0.9; letter-spacing: -0.028em; color: #F5F3F0;">Choc Blanc</h1>
      <p style="margin: 0; font-weight: 500; font-size: 36px; line-height: 1.2; color: #E0A47C; text-wrap: pretty;">Now capped with dark chocolate cream.</p>
      <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 16px;">
        <div style="height: 1px; background: rgba(245,243,240,0.16);"></div>
        <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px;">
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <div style="font-weight: 500; font-size: 17px; letter-spacing: 0.22em; color: #C4703F; text-transform: uppercase;">Selamat Hari Merdeka ke-69</div>
            <div style="font-weight: 700; font-size: 34px; line-height: 1; color: #F5F3F0; letter-spacing: -0.01em;">&deg;Celsius Coffee</div>
          </div>
          <div style="font-weight: 500; font-size: 15px; letter-spacing: 0.14em; color: rgba(245,243,240,0.55); text-transform: uppercase; text-align: right;">Shah Alam &middot; Conezion<br>Tamarind</div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
