<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @font-face { font-family: "Peachi"; font-weight: 700; font-style: normal; src: url(data:font/otf;base64,__PEACHI_BOLD__) format("opentype"); }
    @font-face { font-family: "Peachi"; font-weight: 500; font-style: normal; src: url(data:font/otf;base64,__PEACHI_MED__) format("opentype"); }
    body { margin: 0; background: #0F0500; font-family: "Peachi", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    a { color: #FBBF24; } a:hover { color: #C97A4E; }
  </style>
</helmet>

<!-- App home carousel, 1.07:1. Full-bleed photograph: the table runs edge to
     edge and the copy sits ON it under a gradient, rather than in a separate
     block of flat colour. hero-home.jpg is cut at exactly this aspect, so
     object-fit: cover crops nothing and the glass (y 166..754) is never
     clipped. The scrims stop short of opaque so the wood still reads through
     the copy. -->
<div style="width: 1200px; height: 1121px; position: relative; overflow: hidden; background: #160800;">

  <img src="hero-home.jpg" alt="Choc Blanc iced espresso with whipped dark chocolate cream" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;">

  <!-- legibility scrims, both stopping short of solid so the table shows through -->
  <div style="position: absolute; inset: 0 0 auto 0; height: 190px; background: linear-gradient(180deg, rgba(22,8,0,0.72) 0%, rgba(22,8,0,0.22) 60%, rgba(22,8,0,0) 100%);"></div>
  <div style="position: absolute; inset: auto 0 0 0; height: 560px; background: linear-gradient(180deg, rgba(22,8,0,0) 0%, rgba(22,8,0,0.42) 34%, rgba(22,8,0,0.82) 66%, rgba(22,8,0,0.93) 100%);"></div>

  <div style="position: absolute; inset: 0; padding: 40px 48px 44px 48px; display: flex; flex-direction: column; justify-content: space-between;">

    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 24px;">
      <div style="font-weight: 700; font-size: 44px; line-height: 1; color: #F5F3F0; letter-spacing: -0.01em;">&deg;C</div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 7px;">
        <div style="font-weight: 700; font-size: 15px; letter-spacing: 0.30em; color: #FBBF24; text-transform: uppercase;">Merdeka Menu</div>
        <div style="font-weight: 500; font-size: 13px; letter-spacing: 0.16em; color: rgba(245,243,240,0.72); text-transform: uppercase;">31 Ogos &ndash; 30 Sept 2026</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; align-items: center; gap: 16px;">
        <span style="background: #A64B2C; color: #F5F3F0; font-weight: 700; font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase; padding: 10px 18px; border-radius: 4px;">New on the menu</span>
        <span style="font-weight: 700; font-size: 26px; color: #FBBF24; letter-spacing: 0.01em;">RM14.90</span>
      </div>
      <h1 style="margin: 0; font-weight: 700; font-size: 118px; line-height: 0.92; letter-spacing: -0.025em; color: #F5F3F0;">Choc Blanc</h1>
      <p style="margin: 0; font-weight: 500; font-size: 31px; line-height: 1.25; color: #E0A47C; text-wrap: pretty;">Now capped with dark chocolate cream.</p>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
