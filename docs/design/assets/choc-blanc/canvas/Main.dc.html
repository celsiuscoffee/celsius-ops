<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @font-face { font-family: "Peachi"; font-weight: 700; font-style: normal; src: url(data:font/otf;base64,__PEACHI_BOLD__) format("opentype"); }
    @font-face { font-family: "Peachi"; font-weight: 500; font-style: normal; src: url(data:font/otf;base64,__PEACHI_MED__) format("opentype"); }
    body { margin: 0; background: #0F0500; font-family: "Peachi", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    a { color: #FBBF24; } a:hover { color: #C97A4E; }
  </style>
</helmet>

<div style="width: 1200px; height: 1121px; position: relative; overflow: hidden; background: #160800; display: flex; flex-direction: column;">

  <!-- PHOTO -->
  <div style="position: relative; height: 726px; overflow: hidden;">
    <img src="hero.jpg" alt="Choc Blanc iced espresso with whipped dark chocolate cream" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 44%; display: block;">

    <!-- top scrim so the header type stays legible over the wood -->
    <div style="position: absolute; inset: 0 0 auto 0; height: 220px; background: linear-gradient(180deg, rgba(22,8,0,0.82) 0%, rgba(22,8,0,0.34) 55%, rgba(22,8,0,0) 100%);"></div>

    <!-- header row -->
    <div style="position: absolute; top: 40px; left: 48px; right: 48px; display: flex; justify-content: space-between; align-items: flex-start; gap: 24px;">
      <div style="font-weight: 700; font-size: 44px; line-height: 1; color: #F5F3F0; letter-spacing: -0.01em;">°C</div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 7px;">
        <div style="font-weight: 700; font-size: 15px; letter-spacing: 0.30em; color: #FBBF24; text-transform: uppercase;">Merdeka Menu</div>
        <div style="font-weight: 500; font-size: 13px; letter-spacing: 0.16em; color: rgba(245,243,240,0.72); text-transform: uppercase;">31 Ogos – 30 Sept 2026</div>
      </div>
    </div>

    <!-- bottom fade into the copy band -->
    <div style="position: absolute; inset: auto 0 0 0; height: 190px; background: linear-gradient(180deg, rgba(22,8,0,0) 0%, rgba(22,8,0,0.65) 62%, #160800 100%);"></div>
  </div>

  <!-- COPY BAND -->
  <div style="flex-grow: 1; background: #160800; padding: 0 48px 44px 48px; display: flex; flex-direction: column; justify-content: center; gap: 18px;">

    <div style="display: flex; align-items: center; gap: 16px;">
      <span style="background: #A64B2C; color: #F5F3F0; font-weight: 700; font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase; padding: 10px 18px; border-radius: 4px;">New on the menu</span>
      <span style="font-weight: 700; font-size: 26px; color: #FBBF24; letter-spacing: 0.01em;">RM14.90</span>
    </div>

    <h1 style="margin: 0; font-weight: 700; font-size: 118px; line-height: 0.92; letter-spacing: -0.025em; color: #F5F3F0;">Choc Blanc</h1>

    <p style="margin: 0; font-weight: 500; font-size: 31px; line-height: 1.25; color: #C97A4E; text-wrap: pretty;">Now capped with dark chocolate cream.</p>

  </div>

</div>
</x-dc>
</body>
</html>
