<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @font-face { font-family: "Peachi"; font-weight: 700; font-style: normal; src: url(data:font/otf;base64,__PEACHI_BOLD__) format("opentype"); }
    @font-face { font-family: "Peachi"; font-weight: 500; font-style: normal; src: url(data:font/otf;base64,__PEACHI_MED__) format("opentype"); }
    body { margin: 0; background: #0F0500; font-family: "Peachi", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    a { color: #FBBF24; } a:hover { color: #C97A4E; }
  </style>
</helmet>

<!-- Square 1080x1080 for the grid, Facebook and WhatsApp. Least room of the
     three, so it carries only the name and the one line that sells it; no
     price, and no description. Glass sits at y 187..818, leaving 262px of
     table for the copy. -->
<div style="width: 1080px; height: 1080px; position: relative; overflow: hidden; background: #160800;">
  <img src="hero-ig-square.jpg" alt="Choc Blanc iced espresso with whipped dark chocolate cream" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;">
  <div style="position: absolute; inset: 0 0 auto 0; height: 200px; background: linear-gradient(180deg, rgba(22,8,0,0.74) 0%, rgba(22,8,0,0.22) 60%, rgba(22,8,0,0) 100%);"></div>
  <div style="position: absolute; inset: auto 0 0 0; height: 520px; background: linear-gradient(180deg, rgba(22,8,0,0) 0%, rgba(22,8,0,0.42) 32%, rgba(22,8,0,0.84) 68%, rgba(22,8,0,0.94) 100%);"></div>

  <div style="position: absolute; inset: 0; padding: 48px 58px 52px 58px; display: flex; flex-direction: column; justify-content: space-between;">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;">
      <div style="font-weight: 700; font-size: 42px; line-height: 1; color: #F5F3F0; letter-spacing: -0.01em;">&deg;C</div>
      <div style="font-weight: 700; font-size: 15px; letter-spacing: 0.28em; color: #FBBF24; text-transform: uppercase; text-align: right; line-height: 1.6;">Merdeka Menu</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 18px;">
      <div>
        <span style="display: inline-block; background: #A64B2C; color: #F5F3F0; font-weight: 700; font-size: 15px; letter-spacing: 0.24em; text-transform: uppercase; padding: 11px 20px; border-radius: 4px;">New on the menu</span>
      </div>
      <h1 style="margin: 0; font-weight: 700; font-size: 118px; line-height: 0.9; letter-spacing: -0.028em; color: #F5F3F0;">Choc Blanc</h1>
      <p style="margin: 0; font-weight: 500; font-size: 31px; line-height: 1.2; color: #E0A47C; text-wrap: pretty;">Now capped with dark chocolate cream.</p>
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-top: 6px;">
        <div style="font-weight: 700; font-size: 28px; line-height: 1; color: #F5F3F0; letter-spacing: -0.01em;">&deg;Celsius Coffee</div>
        <div style="font-weight: 500; font-size: 14px; letter-spacing: 0.14em; color: rgba(245,243,240,0.55); text-transform: uppercase; text-align: right;">Shah Alam &middot; Conezion &middot; Tamarind</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
