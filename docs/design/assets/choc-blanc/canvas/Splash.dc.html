<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @font-face { font-family: "Peachi"; font-weight: 700; font-style: normal; src: url(data:font/otf;base64,__PEACHI_BOLD__) format("opentype"); }
    @font-face { font-family: "Peachi"; font-weight: 500; font-style: normal; src: url(data:font/otf;base64,__PEACHI_MED__) format("opentype"); }
    body { margin: 0; background: #0F0500; font-family: "Peachi", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    a { color: #FBBF24; } a:hover { color: #C97A4E; }
  </style>
</helmet>

<!-- 1080x2340 phone splash. The app paints this full-bleed with resizeMode="cover",
     draws a close/countdown badge at top-right (~top 130px, 70px tall at this scale)
     and a "TAP TO OPEN" caption ~175px from the bottom. Everything that must be read
     is kept inside 210px top / 300px bottom. -->
<div style="width: 1080px; height: 2340px; position: relative; overflow: hidden; background: #160800; display: flex; flex-direction: column;">

  <!-- HEADER (left half only — the app's close badge occupies the top-right) -->
  <div style="padding: 210px 72px 0 72px; display: flex; flex-direction: column; gap: 26px;">
    <div style="font-weight: 700; font-size: 68px; line-height: 1; color: #F5F3F0; letter-spacing: -0.01em;">°C</div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-weight: 700; font-size: 22px; letter-spacing: 0.32em; color: #FBBF24; text-transform: uppercase;">Merdeka Menu</div>
      <div style="font-weight: 500; font-size: 19px; letter-spacing: 0.18em; color: rgba(245,243,240,0.66); text-transform: uppercase;">31 Ogos – 30 Sept 2026</div>
    </div>
  </div>

  <!-- PHOTO -->
  <div style="position: relative; margin-top: 74px; height: 880px; overflow: hidden;">
    <img src="hero-splash.jpg" alt="Choc Blanc iced espresso with whipped dark chocolate cream" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block;">
    <div style="position: absolute; inset: 0 0 auto 0; height: 150px; background: linear-gradient(180deg, #160800 0%, rgba(22,8,0,0.55) 45%, rgba(22,8,0,0) 100%);"></div>
    <div style="position: absolute; inset: auto 0 0 0; height: 180px; background: linear-gradient(180deg, rgba(22,8,0,0) 0%, rgba(22,8,0,0.58) 62%, #160800 100%);"></div>
  </div>

  <!-- COPY -->
  <div style="flex-grow: 1; padding: 0 72px 300px 72px; display: flex; flex-direction: column; gap: 26px;">

    <div>
      <span style="display: inline-block; background: #A64B2C; color: #F5F3F0; font-weight: 700; font-size: 20px; letter-spacing: 0.24em; text-transform: uppercase; padding: 14px 26px; border-radius: 5px;">New on the menu</span>
    </div>

    <h1 style="margin: 0; font-weight: 700; font-size: 156px; line-height: 0.9; letter-spacing: -0.028em; color: #F5F3F0;">Choc Blanc</h1>

    <p style="margin: 0; font-weight: 500; font-size: 42px; line-height: 1.2; color: #C97A4E; text-wrap: pretty;">Now capped with dark chocolate cream.</p>

    <p style="margin: 6px 0 0 0; font-weight: 500; font-size: 27px; line-height: 1.55; color: rgba(245,243,240,0.78); max-width: 800px; text-wrap: pretty;">Double espresso over ice, capped with whipped dark chocolate cream, a dusting of cocoa and candied orange peel.</p>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 18px;">
      <div style="height: 1px; background: rgba(245,243,240,0.14);"></div>
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px;">
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <div style="font-weight: 500; font-size: 19px; letter-spacing: 0.22em; color: #A64B2C; text-transform: uppercase;">Selamat Hari Merdeka ke-69</div>
          <div style="font-weight: 700; font-size: 40px; line-height: 1; color: #F5F3F0; letter-spacing: -0.01em;">°Celsius Coffee</div>
        </div>
        <div style="font-weight: 500; font-size: 17px; letter-spacing: 0.14em; color: rgba(245,243,240,0.5); text-transform: uppercase; text-align: right;">Shah Alam · Conezion<br>Tamarind</div>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
