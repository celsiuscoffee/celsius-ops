name: pickup-native OTA catch-up (legacy runtimes)

# One-time / on-demand catch-up publish for the customer pickup app.
#
# WHY THIS EXISTS: pickup-native moved from runtimeVersion policy `appVersion`
# to `fingerprint` (2026-07-25) to stop the "old bundle suddenly reappears"
# regression. The fleet installed BEFORE that switch is pinned to the appVersion
# runtime of its store build (today `1.0.3`), and the normal pickup-native-ota.yml
# now publishes against the NEW fingerprint runtime those installs do NOT match.
# This republishes the current pickup JS against the legacy `1.0.3` runtime so
# already-installed apps pull the latest bundle on next launch.
#
# HOW TO FIRE: bump the marker file apps/pickup-native/.ota-catchup-trigger on the
# branch below. This mirrors pickup-native-ota-deploy.yml exactly (push + marker,
# no workflow_dispatch) — that shape is the one the GitHub integration can run
# (workflow_dispatch 403s on Actions:write; a workflow_dispatch/inputs variant
# also startup-failed here). Only the marker should change in the triggering commit.
#
# SAFETY: 1.0.3 is the latest store build and is native-compatible with current
# JS (it is the line this repo is on). Requires repo secret EXPO_TOKEN.

on:
  push:
    branches:
      - "claude/version-regression-bug-adwked"
    paths:
      - "apps/pickup-native/.ota-catchup-trigger"

jobs:
  catchup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pickup-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Republish current JS to the 1.0.3 fleet
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        # --runtime-version 1.0.3 overrides the app.json fingerprint policy for
        # this publish, tagging the update with the legacy appVersion runtime so
        # the in-field binaries pick it up. --platform all (ios + android);
        # --environment production loads the prod EAS env vars so the bundle
        # config matches the installed app.
        run: |
          npx eas-cli@latest update \
            --channel production \
            --platform all \
            --runtime-version 1.0.3 \
            --environment production \
            --message "catch-up: republish current bundle to the 1.0.3 fleet" \
            --non-interactive
